; ShrimpGuard AI - ESP32 PlatformIO configuration
;
; IMPORTANT:
; The board ID below is a PLACEHOLDER. Replace it with the confirmed ESP32
; board ID before building. No pin numbers are configured here because the
; hardware pin map is To Be Confirmed.

[env:esp32]
platform = espressif32
board = esp32dev          ; TODO: replace with the confirmed board ID
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=0

; Sensor libraries will be added only after the sensor models and interfaces
; are confirmed. See hardware/sensors/*.md.
